# Headless Xorg on the NVIDIA card, no monitor: perf bench presents through the card's own GLX/present path
# instead of Xvfb's software framebuffer. Started by gpu.sh (GPU_XORG=1) as display :90.
Section "ServerFlags"
	Option "AutoAddDevices" "false"
	Option "AutoEnableDevices" "false"
	Option "DontVTSwitch" "true"
EndSection
Section "Device"
	Identifier "nv"
	Driver "nvidia"
	# gpu.sh ensure_xorg rewrites the bus id below to the box's NVIDIA card
	BusID "PCI:2:0:0"
	Option "AllowEmptyInitialConfiguration" "true"
	Option "UseDisplayDevice" "none"
EndSection
Section "Screen"
	Identifier "scr"
	Device "nv"
	DefaultDepth 24
	SubSection "Display"
		Depth 24
		Virtual 1920 1080
	EndSubSection
EndSection
