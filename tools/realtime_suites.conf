# Real-time suites: THE one list, read by tools/gpu.sh (box routing and box slots) and tools/heavy (dev02's
# memory floor and slot cap). These measure the netcode against wall time (ENet and the relay keep wall time while
# the game ticks), so a runner stalled for 90-165 ms by memory reclaim or a full box fails them falsely.
# Shell patterns, space or line separated, matched against each suite name of `game.sh test <suite...>` (a shard
# SUITE.SHARD counts as SUITE) or a scene's base name (res://x/<suite>.tscn). A job that names one such suite is
# real-time as a whole. GPU_REALTIME_SUITES (gpu.sh) / HEAVY_REALTIME_SUITES (heavy) replace the list.
headless_lossy
headless_lossy_*
headless_latency
headless_feel
